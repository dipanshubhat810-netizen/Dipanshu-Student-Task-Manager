<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dipanshu's Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Dipanshu's Student Task Manager</h1>
            <p>Stay organized, Dipanshu. Track your assignments, projects and deadlines.</p>
        </header>

        <div class="task-input">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <select id="priorityInput">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>

            <button onclick="addTask()">Add Task</button>
        </div>

        <div class="task-summary">
            <span>Total: <strong id="totalTasks">0</strong></span>
            <span>Completed: <strong id="completedTasks">0</strong></span>
            <span>Pending: <strong id="pendingTasks">0</strong></span>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
